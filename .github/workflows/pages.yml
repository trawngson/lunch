name: Deploy lunch menu

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch and sanitize menu
        run: node scripts/fetch-menu.mjs
        env:
          VIN_TOKEN: ${{ secrets.VIN_TOKEN }}
          VIN_STUDENT_CODE: ${{ secrets.VIN_STUDENT_CODE }}
          VIN_API_URL: ${{ secrets.VIN_API_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build static website
        run: npm run build:pages
        env:
          DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_MENU_PATH: /menu.json

      - name: Prove secrets are absent from publishable files
        run: node scripts/verify-artifact-secrets.mjs out VIN_TOKEN VIN_STUDENT_CODE VIN_API_URL
        env:
          VIN_TOKEN: ${{ secrets.VIN_TOKEN }}
          VIN_STUDENT_CODE: ${{ secrets.VIN_STUDENT_CODE }}
          VIN_API_URL: ${{ secrets.VIN_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
